<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShiftWaveFunction Verification Tests</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            margin: 20px;
            background: #1a1a1a;
            color: #00ff00;
            line-height: 1.4;
        }
        .test-container {
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 5px;
            margin: 15px 0;
            padding: 15px;
        }
        .test-header {
            color: #00ccff;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }
        .pass {
            color: #00ff00;
            font-weight: bold;
        }
        .fail {
            color: #ff4444;
            font-weight: bold;
        }
        .warn {
            color: #ffaa00;
            font-weight: bold;
        }
        .performance {
            color: #ff88ff;
        }
        .details {
            margin-left: 20px;
            color: #aaa;
            font-size: 14px;
        }
        .summary {
            background: #002200;
            border: 2px solid #00ff00;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
        button {
            background: #333;
            color: #00ff00;
            border: 1px solid #555;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            border-radius: 3px;
        }
        button:hover {
            background: #444;
        }
    </style>
</head>
<body>
    <h1>ShiftWaveFunction Verification Tests</h1>
    <p>Comprehensive testing to ensure the refactored shiftWaveFunction() maintains 100% behavioral compatibility.</p>
    
    <button onclick="runAllTests()">Run All Tests</button>
    <button onclick="clearResults()">Clear Results</button>
    
    <div id="results"></div>

    <script type="module">
        import { ComputationEngine } from '../src/ComputationEngine.js';
        import { SimulationState } from '../src/SimulationState.js';
        import * as C from '../src/constants.js';

        // create a mock SimulationState for testing ComputationEngine.shiftWaveFunctionSubpixel
        class MockSimulationState {
            constructor(width = C.GRID_SIZE, height = C.GRID_SIZE) {
                this.gridSize = { width, height };
                this.params = {
                    x0: C.INITIAL_X0, y0: C.INITIAL_Y0,
                    px: C.INITIAL_P_X, py: C.INITIAL_P_Y,
                    sigma: C.INITIAL_SIGMA,
                    dt: C.INITIAL_DT, brightness: 1.0,
                    boundaryMode: 'reflective',
                    barrierEnergy: 300,
                };
                this.psi = new Float64Array(width * height * 2);
                this.potential = new Float64Array(width * height);
                this.kineticOperatorK = new Float64Array(width * height);

                this.createTestWaveFunction();
            }

            createTestWaveFunction() {
                const width = this.gridSize.width;
                const height = this.gridSize.height;

                // create a simple Gaussian wave packet
                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        const idx = (y * width + x) * 2;
                        const phase = (x + y) * 0.1;
                        const envelope = Math.exp(-((x - width/2)**2 + (y - height/2)**2) / 200);
                        this.psi[idx] = envelope * Math.cos(phase);
                        this.psi[idx + 1] = envelope * Math.sin(phase);
                    }
                }

                // normalise
                let norm = 0;
                for (let i = 0; i < this.psi.length; i += 2) {
                    norm += this.psi[i]**2 + this.psi[i + 1]**2;
                }
                norm = Math.sqrt(norm);
                for (let i = 0; i < this.psi.length; i++) {
                    this.psi[i] /= norm;
                }
            }
        }

        // test utilities
        function createTestWaveFunction(sim, pattern = 'gaussian') {
            const width = sim.gridSize.width;
            const height = sim.gridSize.height;
            
            if (pattern === 'gaussian') {
                sim.resetWaveFunction(); // use default Gaussian
            } else if (pattern === 'delta') {
                // create a simple delta function at center
                sim.psi.fill(0);
                const centerX = Math.floor(width / 2);
                const centerY = Math.floor(height / 2);
                const idx = (centerY * width + centerX) * 2;
                sim.psi[idx] = 1.0; // real part
                sim.psi[idx + 1] = 0.0; // imaginary part
            } else if (pattern === 'complex') {
                // create a test pattern with both real and imaginary components
                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        const idx = (y * width + x) * 2;
                        const phase = (x + y) * 0.1;
                        sim.psi[idx] = Math.cos(phase) * Math.exp(-((x - width/2)**2 + (y - height/2)**2) / 200);
                        sim.psi[idx + 1] = Math.sin(phase) * Math.exp(-((x - width/2)**2 + (y - height/2)**2) / 200);
                    }
                }
            }
        }

        function arrayEquals(a, b, tolerance = 1e-14) {
            if (a.length !== b.length) return false;
            for (let i = 0; i < a.length; i++) {
                if (Math.abs(a[i] - b[i]) > tolerance) {
                    return false;
                }
            }
            return true;
        }

        function calculateNorm(psi) {
            let norm = 0;
            for (let i = 0; i < psi.length; i += 2) {
                const real = psi[i];
                const imag = psi[i + 1];
                norm += real * real + imag * imag;
            }
            return Math.sqrt(norm);
        }

        function copyArray(arr) {
            return new Float64Array(arr);
        }

        // test implementation - now testing the actual ComputationEngine.shiftWaveFunctionSubpixel
        const tests = [];

        tests.push({
            name: "Subpixel Shift Basic Functionality",
            run: async function() {
                const results = [];

                try {
                    const engine = new ComputationEngine({ width: 64, height: 64 });
                    const state = new MockSimulationState(64, 64);

                    // store original wave function
                    const originalPsi = copyArray(state.psi);
                    const originalNorm = calculateNorm(state.psi);

                    // test small subpixel shifts
                    const shifts = [
                        [0.5, 0],    // half pixel right
                        [0, 0.5],    // half pixel down
                        [0.25, 0.75], // quarter pixel right, 3/4 pixel down
                        [-0.3, 0.8]  // negative x, positive y
                    ];

                    for (const [dx, dy] of shifts) {
                        // reset to original state
                        state.psi.set(originalPsi);

                        // convert pixel shifts to physical units
                        const dxPhysical = dx * (C.DOMAIN_SIZE / 64);
                        const dyPhysical = dy * (C.DOMAIN_SIZE / 64);

                        // apply subpixel shift
                        engine.shiftWaveFunctionSubpixel(state, dxPhysical, dyPhysical);

                        // check that wave function is still valid
                        const hasFiniteValues = state.psi.every(v => isFinite(v));
                        const finalNorm = calculateNorm(state.psi);
                        const normPreserved = Math.abs(originalNorm - finalNorm) < 1e-10;

                        results.push({
                            test: `Subpixel shift [${dx}, ${dy}] pixels`,
                            passed: hasFiniteValues && normPreserved,
                            details: `Finite values: ${hasFiniteValues}, Norm preserved: ${normPreserved} (${originalNorm.toFixed(6)} → ${finalNorm.toFixed(6)})`
                        });
                    }

                } catch (error) {
                    results.push({
                        test: 'Basic subpixel shift functionality',
                        passed: false,
                        error: error.message
                    });
                }

                return results;
            }
        });

        tests.push({
            name: "Round-trip Subpixel Shifts",
            run: async function() {
                const results = [];

                try {
                    const engine = new ComputationEngine({ width: 32, height: 32 });
                    const state = new MockSimulationState(32, 32);

                    // test that forward and backward shifts approximately restore the original
                    const shifts = [
                        [0.5, 0.3],
                        [0.7, -0.2],
                        [0.1, 0.9],
                        [-0.4, 0.6]
                    ];

                    for (const [dx, dy] of shifts) {
                        const originalPsi = copyArray(state.psi);

                        // convert to physical units
                        const dxPhysical = dx * (C.DOMAIN_SIZE / 32);
                        const dyPhysical = dy * (C.DOMAIN_SIZE / 32);

                        // forward shift
                        engine.shiftWaveFunctionSubpixel(state, dxPhysical, dyPhysical);

                        // backward shift (negative)
                        engine.shiftWaveFunctionSubpixel(state, -dxPhysical, -dyPhysical);

                        // check if we recovered the original (within numerical precision)
                        const maxError = Math.max(...state.psi.map((v, i) => Math.abs(v - originalPsi[i])));
                        const recovered = maxError < 1e-10;

                        results.push({
                            test: `Round-trip shift [${dx}, ${dy}] pixels`,
                            passed: recovered,
                            details: `Max error: ${maxError.toExponential(3)}`
                        });

                        // restore original for next test
                        state.psi.set(originalPsi);
                    }

                } catch (error) {
                    results.push({
                        test: 'Round-trip subpixel shifts',
                        passed: false,
                        error: error.message
                    });
                }

                return results;
            }
        });

        tests.push({
            name: "Different Grid Sizes",
            run: async function() {
                const results = [];
                const sizes = [16, 32, 64, 128];

                for (const size of sizes) {
                    try {
                        const engine = new ComputationEngine({ width: size, height: size });
                        const state = new MockSimulationState(size, size);

                        // test a simple shift
                        const originalNorm = calculateNorm(state.psi);
                        const dxPhysical = 0.5 * (C.DOMAIN_SIZE / size);
                        const dyPhysical = 0.3 * (C.DOMAIN_SIZE / size);

                        engine.shiftWaveFunctionSubpixel(state, dxPhysical, dyPhysical);

                        const hasFiniteValues = state.psi.every(v => isFinite(v));
                        const finalNorm = calculateNorm(state.psi);
                        const normPreserved = Math.abs(originalNorm - finalNorm) < 1e-10;

                        results.push({
                            test: `${size}x${size} grid subpixel shift`,
                            passed: hasFiniteValues && normPreserved,
                            details: `Finite values: ${hasFiniteValues}, Norm: ${originalNorm.toFixed(6)} → ${finalNorm.toFixed(6)}`
                        });

                    } catch (error) {
                        results.push({
                            test: `${size}x${size} grid subpixel shift`,
                            passed: false,
                            error: error.message
                        });
                    }
                }

                return results;
            }
        });

        tests.push({
            name: "Zero Shifts (Identity Test)",
            run: async function() {
                const results = [];

                try {
                    const engine = new ComputationEngine({ width: 64, height: 64 });
                    const state = new MockSimulationState(64, 64);

                    const originalPsi = copyArray(state.psi);

                    // test zero shifts
                    engine.shiftWaveFunctionSubpixel(state, 0, 0);

                    const isIdentity = arrayEquals(originalPsi, state.psi, 1e-15);

                    results.push({
                        test: 'Zero shift should be identity',
                        passed: isIdentity,
                        details: `Max difference: ${isIdentity ? '0' : Math.max(...state.psi.map((v, i) => Math.abs(v - originalPsi[i]))).toExponential(3)}`
                    });

                } catch (error) {
                    results.push({
                        test: 'Zero shift identity test',
                        passed: false,
                        error: error.message
                    });
                }

                return results;
            }
        });

        // test runner
        window.runAllTests = async function() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="test-container"><div class="test-header">Running tests...</div></div>';
            
            const allResults = [];
            let totalTests = 0;
            let passedTests = 0;
            
            for (const test of tests) {
                const testDiv = document.createElement('div');
                testDiv.className = 'test-container';
                testDiv.innerHTML = `<div class="test-header">${test.name}</div><div class="details">Running...</div>`;
                resultsDiv.appendChild(testDiv);
                
                try {
                    const results = await test.run();
                    let html = `<div class="test-header">${test.name}</div>`;
                    
                    for (const result of results) {
                        totalTests++;
                        const status = result.passed ? 'PASS' : 'FAIL';
                        const statusClass = result.passed ? 'pass' : 'fail';
                        
                        if (result.passed) passedTests++;
                        
                        html += `<div class="details">
                            <span class="${statusClass}">[${status}]</span> ${result.test}`;
                        
                        if (result.details) {
                            html += `<br>    ${result.details}`;
                        }
                        if (result.error) {
                            html += `<br>    <span class="fail">Error: ${result.error}</span>`;
                        }
                        if (result.maxDiff && result.maxDiff > 0) {
                            html += `<br>    <span class="warn">Max difference: ${result.maxDiff.toExponential(3)}</span>`;
                        }
                        
                        html += `</div>`;
                    }
                    
                    testDiv.innerHTML = html;
                    allResults.push(...results);
                    
                } catch (e) {
                    testDiv.innerHTML = `<div class="test-header">${test.name}</div><div class="details"><span class="fail">[ERROR]</span> ${e.message}</div>`;
                }
            }
            
            // add summary
            const summaryDiv = document.createElement('div');
            summaryDiv.className = 'summary';
            const successRate = ((passedTests / totalTests) * 100).toFixed(1);
            const summaryClass = passedTests === totalTests ? 'pass' : 'fail';
            
            summaryDiv.innerHTML = `
                <h2>Test Summary</h2>
                <div class="${summaryClass}">
                    ${passedTests}/${totalTests} tests passed (${successRate}%)
                </div>
                <div class="details">
                    <br>Verification Status: ${passedTests === totalTests ? '✅ ALL TESTS PASS - Refactor maintains 100% behavioral compatibility' : '❌ Some tests failed - Review needed'}
                </div>
            `;
            
            resultsDiv.insertBefore(summaryDiv, resultsDiv.firstChild);
        };

        window.clearResults = function() {
            document.getElementById('results').innerHTML = '';
        };
    </script>
</body>
</html>
