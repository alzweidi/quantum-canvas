<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShiftWaveFunction Verification Tests</title>
    <style>
      body {
        font-family: "Courier New", monospace;
        margin: 20px;
        background: #1a1a1a;
        color: #00ff00;
        line-height: 1.4;
      }
      .test-container {
        background: #0a0a0a;
        border: 1px solid #333;
        border-radius: 5px;
        margin: 15px 0;
        padding: 15px;
      }
      .test-header {
        color: #00ccff;
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 10px;
        border-bottom: 1px solid #333;
        padding-bottom: 5px;
      }
      .pass {
        color: #00ff00;
        font-weight: bold;
      }
      .fail {
        color: #ff4444;
        font-weight: bold;
      }
      .warn {
        color: #ffaa00;
        font-weight: bold;
      }
      .performance {
        color: #ff88ff;
      }
      .details {
        margin-left: 20px;
        color: #aaa;
        font-size: 14px;
      }
      .summary {
        background: #002200;
        border: 2px solid #00ff00;
        padding: 20px;
        margin: 20px 0;
        border-radius: 8px;
      }
      button {
        background: #333;
        color: #00ff00;
        border: 1px solid #555;
        padding: 10px 20px;
        margin: 5px;
        cursor: pointer;
        border-radius: 3px;
      }
      button:hover {
        background: #444;
      }
    </style>
  </head>
  <body>
    <h1>ShiftWaveFunction Verification Tests</h1>
    <p>
      Comprehensive testing to ensure the refactored shiftWaveFunction()
      maintains 100% behavioral compatibility.
    </p>

    <button onclick="runAllTests()">Run All Tests</button>
    <button onclick="clearResults()">Clear Results</button>

    <div id="results"></div>

    <script>
      // constants from constants.js
      const C = {
        GRID_SIZE: 128,
        DOMAIN_SIZE: 20.0,
        INITIAL_X0: 10.0,
        INITIAL_Y0: 10.0,
        INITIAL_P_X: 0.0,
        INITIAL_P_Y: 5.0,
        INITIAL_SIGMA: 1.0,
        INITIAL_DT: 0.01,
        WALL_ENERGY: 1000.0,
        HBAR: 1.0,
        MASS: 1.0,
      };

      // simplified SimulationState class for testing
      class SimulationState {
        constructor() {
          this.gridSize = { width: C.GRID_SIZE, height: C.GRID_SIZE };
          this.params = {
            x0: C.INITIAL_X0,
            y0: C.INITIAL_Y0,
            px: C.INITIAL_P_X,
            py: C.INITIAL_P_Y,
            sigma: C.INITIAL_SIGMA,
            dt: C.INITIAL_DT,
            brightness: 1.0,
            boundaryMode: "reflective",
            barrierEnergy: 300,
          };
          this.psi = new Float64Array(
            this.gridSize.width * this.gridSize.height * 2,
          );
          this.potential = new Float64Array(
            this.gridSize.width * this.gridSize.height,
          );
          this.kineticOperatorK = new Float64Array(
            this.gridSize.width * this.gridSize.height,
          );

          this.resetWaveFunction();
        }

        static _wrap(i, n) {
          return ((i % n) + n) % n;
        }

        static _reflect(i, n) {
          const period = 2 * (n - 1);
          const wrapped = ((i % period) + period) % period;
          return wrapped >= n ? period - wrapped : wrapped;
        }

        static _mapDrop(i, n) {
          return i >= 0 && i < n ? i : -1;
        }

        _getDx() {
          return C.DOMAIN_SIZE / this.gridSize.width;
        }
        _getDy() {
          return C.DOMAIN_SIZE / this.gridSize.height;
        }

        resetWaveFunction() {
          const width = this.gridSize.width;
          const height = this.gridSize.height;
          const dx = C.DOMAIN_SIZE / width;
          const dy = C.DOMAIN_SIZE / height;

          const x0 = this.params.x0;
          const y0 = this.params.y0;

          let norm = 0.0;
          const tempReal = new Array(width * height);
          const tempImag = new Array(width * height);

          for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
              const xf = x * dx;
              const yf = y * dy;

              const gaussianArg =
                -((xf - x0) * (xf - x0) + (yf - y0) * (yf - y0)) /
                (2.0 * this.params.sigma * this.params.sigma);
              const amplitude = Math.exp(gaussianArg);

              const phaseArg =
                (this.params.px * xf + this.params.py * yf) / C.HBAR;
              const real = amplitude * Math.cos(phaseArg);
              const imag = amplitude * Math.sin(phaseArg);

              const idx = y * width + x;
              tempReal[idx] = real;
              tempImag[idx] = imag;
              norm += real * real + imag * imag;
            }
          }

          norm = Math.sqrt(norm * dx * dy);

          for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
              const t = y * width + x;
              const idx = t * 2;
              this.psi[idx] = tempReal[t] / norm;
              this.psi[idx + 1] = tempImag[t] / norm;
            }
          }
        }

        // refactored implementation
        shiftWaveFunction(dx, dy, opts = {}) {
          const { mode = "wrap", renormalize = true } = opts;
          const width = this.gridSize.width;
          const height = this.gridSize.height;

          if (mode === "wrap" && dx % width === 0 && dy % height === 0) {
            return;
          }

          let mapX, mapY;
          if (mode === "wrap") {
            mapX = (x) => SimulationState._wrap(x + dx, width);
            mapY = (y) => SimulationState._wrap(y + dy, height);
          } else if (mode === "reflect") {
            mapX = (x) => SimulationState._reflect(x + dx, width);
            mapY = (y) => SimulationState._reflect(y + dy, height);
          } else if (mode === "drop") {
            mapX = (x) => SimulationState._mapDrop(x + dx, width);
            mapY = (y) => SimulationState._mapDrop(y + dy, height);
          } else {
            throw new Error(
              `Unknown boundary mode: ${mode}. Use 'wrap', 'reflect', or 'drop'.`,
            );
          }

          const tempPsi = new Float64Array(this.psi.length);
          if (mode === "drop") {
            tempPsi.fill(0);
          }

          for (let y = 0; y < height; y++) {
            const newY = mapY(y);
            if (newY === -1) continue;

            for (let x = 0; x < width; x++) {
              const newX = mapX(x);
              if (newX === -1) continue;

              const oldIdx = (y * width + x) * 2;
              const newIdx = (newY * width + newX) * 2;
              tempPsi[newIdx] = this.psi[oldIdx];
              tempPsi[newIdx + 1] = this.psi[oldIdx + 1];
            }
          }

          this.psi.set(tempPsi);

          if (renormalize) {
            this._renormalizeWaveFunction();
          }
        }

        _renormalizeWaveFunction() {
          const width = this.gridSize.width;
          const height = this.gridSize.height;
          const dx = C.DOMAIN_SIZE / width;
          const dy = C.DOMAIN_SIZE / height;

          let norm = 0.0;
          for (let i = 0; i < width * height; i++) {
            const real = this.psi[i * 2];
            const imag = this.psi[i * 2 + 1];
            norm += real * real + imag * imag;
          }

          norm = Math.sqrt(norm * dx * dy);

          if (norm > 1e-15) {
            for (let i = 0; i < this.psi.length; i++) {
              this.psi[i] /= norm;
            }
          }
        }
      }

      // store original implementation for comparison
      class OriginalSimulationState extends SimulationState {
        constructor() {
          super();
        }

        // original implementation before refactoring (for reference testing)
        shiftWaveFunctionOriginal(dx, dy, opts = {}) {
          const { mode = "wrap", renormalize = true } = opts;
          const width = this.gridSize.width;
          const height = this.gridSize.height;

          // no-op wrap guard: skip when shift is multiple of grid dimensions
          if (mode === "wrap" && dx % width === 0 && dy % height === 0) {
            return;
          }

          const tempPsi = new Float64Array(this.psi.length);
          if (mode === "drop") {
            tempPsi.fill(0); // pre-clear for drop mode
          }

          // original implementation with more branching inside loops
          for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
              let newX, newY;

              // original branching logic inside loops
              if (mode === "wrap") {
                newX = SimulationState._wrap(x + dx, width);
                newY = SimulationState._wrap(y + dy, height);
              } else if (mode === "reflect") {
                newX = SimulationState._reflect(x + dx, width);
                newY = SimulationState._reflect(y + dy, height);
              } else if (mode === "drop") {
                newX = SimulationState._mapDrop(x + dx, width);
                newY = SimulationState._mapDrop(y + dy, height);
                if (newX === -1 || newY === -1) continue;
              } else {
                throw new Error(
                  `Unknown boundary mode: ${mode}. Use 'wrap', 'reflect', or 'drop'.`,
                );
              }

              const oldIdx = (y * width + x) * 2;
              const newIdx = (newY * width + newX) * 2;
              tempPsi[newIdx] = this.psi[oldIdx];
              tempPsi[newIdx + 1] = this.psi[oldIdx + 1];
            }
          }

          this.psi.set(tempPsi);

          if (renormalize) {
            this._renormalizeWaveFunction();
          }
        }
      }

      // test utilities
      function createTestWaveFunction(sim, pattern = "gaussian") {
        const width = sim.gridSize.width;
        const height = sim.gridSize.height;

        if (pattern === "gaussian") {
          sim.resetWaveFunction(); // use default Gaussian
        } else if (pattern === "delta") {
          // create a simple delta function at center
          sim.psi.fill(0);
          const centerX = Math.floor(width / 2);
          const centerY = Math.floor(height / 2);
          const idx = (centerY * width + centerX) * 2;
          sim.psi[idx] = 1.0; // real part
          sim.psi[idx + 1] = 0.0; // imaginary part
        } else if (pattern === "complex") {
          // create a test pattern with both real and imaginary components
          for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
              const idx = (y * width + x) * 2;
              const phase = (x + y) * 0.1;
              sim.psi[idx] =
                Math.cos(phase) *
                Math.exp(-((x - width / 2) ** 2 + (y - height / 2) ** 2) / 200);
              sim.psi[idx + 1] =
                Math.sin(phase) *
                Math.exp(-((x - width / 2) ** 2 + (y - height / 2) ** 2) / 200);
            }
          }
        }
      }

      function arrayEquals(a, b, tolerance = 1e-14) {
        if (a.length !== b.length) return false;
        for (let i = 0; i < a.length; i++) {
          if (Math.abs(a[i] - b[i]) > tolerance) {
            return false;
          }
        }
        return true;
      }

      function calculateNorm(psi) {
        let norm = 0;
        for (let i = 0; i < psi.length; i += 2) {
          const real = psi[i];
          const imag = psi[i + 1];
          norm += real * real + imag * imag;
        }
        return Math.sqrt(norm);
      }

      function copyArray(arr) {
        return new Float64Array(arr);
      }

      // test implementation
      const tests = [];

      tests.push({
        name: "Mathematical Equivalence - Basic Shifts",
        run: async function () {
          const results = [];
          const modes = ["wrap", "reflect", "drop"];
          const shifts = [
            [0, 0],
            [1, 1],
            [-1, -1],
            [5, 3],
            [-7, 2],
            [0, 5],
            [3, 0],
            [-2, -8],
            [10, -5],
          ];

          for (const mode of modes) {
            for (const [dx, dy] of shifts) {
              // test with refactored version
              const sim1 = new SimulationState();
              createTestWaveFunction(sim1, "gaussian");
              const psi1Before = copyArray(sim1.psi);
              sim1.shiftWaveFunction(dx, dy, { mode, renormalize: false });

              // test with "original" version (same algorithm, different structure)
              const sim2 = new OriginalSimulationState();
              sim2.psi.set(psi1Before);
              sim2.shiftWaveFunctionOriginal(dx, dy, {
                mode,
                renormalize: false,
              });

              const isEqual = arrayEquals(sim1.psi, sim2.psi);
              results.push({
                test: `${mode} shift [${dx}, ${dy}]`,
                passed: isEqual,
                maxDiff: isEqual
                  ? 0
                  : Math.max(
                      ...sim1.psi.map((v, i) => Math.abs(v - sim2.psi[i])),
                    ),
              });
            }
          }

          return results;
        },
      });

      tests.push({
        name: "Boundary Mode Comprehensive Testing",
        run: async function () {
          const results = [];
          const gridSizes = [16, 32, 64];

          for (const size of gridSizes) {
            const sim = new SimulationState();
            sim.gridSize.width = size;
            sim.gridSize.height = size;
            sim.psi = new Float64Array(size * size * 2);

            // test wrap mode with multiples of grid size
            createTestWaveFunction(sim, "delta");
            const originalPsi = copyArray(sim.psi);
            sim.shiftWaveFunction(size, size, { mode: "wrap" });
            const wrapIdentity = arrayEquals(originalPsi, sim.psi);
            results.push({
              test: `Wrap identity [${size}x${size}] shift by grid size`,
              passed: wrapIdentity,
            });

            // test wrap mode with 2x grid size
            sim.psi.set(originalPsi);
            sim.shiftWaveFunction(2 * size, 2 * size, { mode: "wrap" });
            const wrapIdentity2x = arrayEquals(originalPsi, sim.psi);
            results.push({
              test: `Wrap identity [${size}x${size}] shift by 2x grid size`,
              passed: wrapIdentity2x,
            });

            // test reflection robustness (norm preservation and finite values)
            sim.psi.set(originalPsi);
            const normBeforeReflect = calculateNorm(sim.psi);
            sim.shiftWaveFunction(1, 0, { mode: "reflect" });
            sim.shiftWaveFunction(-1, 0, { mode: "reflect" });
            const normAfterReflect = calculateNorm(sim.psi);
            const hasFiniteValues = sim.psi.every((v) => isFinite(v));
            const normPreserved =
              Math.abs(normBeforeReflect - normAfterReflect) < 1e-12;
            const reflectRobustness = hasFiniteValues && normPreserved;
            results.push({
              test: `Reflect robustness [${size}x${size}] forward/backward (norm preserved, no NaNs)`,
              passed: reflectRobustness,
              details: `Norm before: ${normBeforeReflect.toFixed(6)}, after: ${normAfterReflect.toFixed(6)}, finite: ${hasFiniteValues}`,
            });
          }

          return results;
        },
      });

      tests.push({
        name: "Edge Cases and Large Shifts",
        run: async function () {
          const results = [];
          const sim = new SimulationState();

          // test very large shifts
          const largeShifts = [
            [1000, 500],
            [-800, 1200],
            [0, -2000],
            [5000, 0],
          ];

          for (const [dx, dy] of largeShifts) {
            for (const mode of ["wrap", "reflect", "drop"]) {
              try {
                createTestWaveFunction(sim, "gaussian");
                const normBefore = calculateNorm(sim.psi);
                sim.shiftWaveFunction(dx, dy, { mode, renormalize: false });
                const normAfter = calculateNorm(sim.psi);

                // for wrap and reflect, norm should be conserved
                // for drop, norm may decrease
                const normConserved =
                  mode === "drop"
                    ? normAfter <= normBefore + 1e-12
                    : Math.abs(normBefore - normAfter) < 1e-12;

                results.push({
                  test: `Large shift [${dx}, ${dy}] mode=${mode}`,
                  passed: true, // no crash
                  details: `Norm: ${normBefore.toFixed(6)} -> ${normAfter.toFixed(6)}, conserved: ${normConserved}`,
                });
              } catch (e) {
                results.push({
                  test: `Large shift [${dx}, ${dy}] mode=${mode}`,
                  passed: false,
                  error: e.message,
                });
              }
            }
          }

          return results;
        },
      });

      tests.push({
        name: "Wave Function Normalization",
        run: async function () {
          const results = [];
          const sim = new SimulationState();
          const shifts = [
            [3, 5],
            [-2, 7],
            [0, 10],
            [15, 0],
          ];

          for (const [dx, dy] of shifts) {
            for (const mode of ["wrap", "reflect", "drop"]) {
              // test without renormalization
              createTestWaveFunction(sim, "gaussian");
              const normBefore = calculateNorm(sim.psi);
              sim.shiftWaveFunction(dx, dy, { mode, renormalize: false });
              const normAfterNoRenorm = calculateNorm(sim.psi);

              // test with renormalization
              createTestWaveFunction(sim, "gaussian");
              sim.shiftWaveFunction(dx, dy, { mode, renormalize: true });
              const normAfterRenorm = calculateNorm(sim.psi);

              // check normalization behavior
              const renormWorks =
                Math.abs(normAfterRenorm - normBefore) < 1e-12;
              let conservationExpected = true;

              if (mode === "wrap" || mode === "reflect") {
                // should conserve norm even without renormalization
                conservationExpected =
                  Math.abs(normBefore - normAfterNoRenorm) < 1e-12;
              } else if (mode === "drop") {
                // may lose norm, but should not gain
                conservationExpected = normAfterNoRenorm <= normBefore + 1e-12;
              }

              results.push({
                test: `Normalization [${dx}, ${dy}] mode=${mode}`,
                passed: renormWorks && conservationExpected,
                details: `Before: ${normBefore.toFixed(6)}, After (no-renorm): ${normAfterNoRenorm.toFixed(6)}, After (renorm): ${normAfterRenorm.toFixed(6)}`,
              });
            }
          }

          return results;
        },
      });

      tests.push({
        name: "Complex Number Handling",
        run: async function () {
          const results = [];
          const sim = new SimulationState();

          // test with complex wave function
          createTestWaveFunction(sim, "complex");
          const originalReal = [];
          const originalImag = [];

          for (let i = 0; i < sim.psi.length; i += 2) {
            originalReal.push(sim.psi[i]);
            originalImag.push(sim.psi[i + 1]);
          }

          // test various shifts with complex data
          const shifts = [
            [1, 0],
            [0, 1],
            [2, 3],
            [-1, -1],
          ];

          for (const [dx, dy] of shifts) {
            for (const mode of ["wrap", "reflect"]) {
              createTestWaveFunction(sim, "complex");
              sim.shiftWaveFunction(dx, dy, { mode, renormalize: false });

              // verify real and imaginary parts are handled correctly
              let realImpliedCorrectly = true;
              let imaginaryHandledCorrectly = true;

              for (let i = 0; i < sim.psi.length; i += 2) {
                if (sim.psi[i] === 0 && sim.psi[i + 1] === 0) continue; // skip zeros

                // basic sanity checks
                if (!isFinite(sim.psi[i]) || !isFinite(sim.psi[i + 1])) {
                  realImpliedCorrectly = false;
                  imaginaryHandledCorrectly = false;
                  break;
                }
              }

              results.push({
                test: `Complex handling [${dx}, ${dy}] mode=${mode}`,
                passed: realImpliedCorrectly && imaginaryHandledCorrectly,
                details: `Real parts: ${realImpliedCorrectly ? "OK" : "FAIL"}, Imaginary parts: ${imaginaryHandledCorrectly ? "OK" : "FAIL"}`,
              });
            }
          }

          return results;
        },
      });

      tests.push({
        name: "No-Op Wrap Optimization",
        run: async function () {
          const results = [];
          const sim = new SimulationState();

          // test the no-op optimization for wrap mode
          createTestWaveFunction(sim, "gaussian");
          const originalPsi = copyArray(sim.psi);

          // these should be no-ops
          const noOpShifts = [
            [sim.gridSize.width, 0],
            [0, sim.gridSize.height],
            [sim.gridSize.width, sim.gridSize.height],
            [2 * sim.gridSize.width, 3 * sim.gridSize.height],
            [-sim.gridSize.width, -sim.gridSize.height],
          ];

          for (const [dx, dy] of noOpShifts) {
            sim.psi.set(originalPsi);
            const start = performance.now();
            sim.shiftWaveFunction(dx, dy, { mode: "wrap" });
            const end = performance.now();

            const isIdentical = arrayEquals(originalPsi, sim.psi);
            const wasfast = end - start < 0.1; // should be very fast (no actual computation)

            results.push({
              test: `No-op optimization [${dx}, ${dy}]`,
              passed: isIdentical,
              details: `Execution time: ${(end - start).toFixed(3)}ms, Fast: ${wasfast}`,
            });
          }

          return results;
        },
      });

      tests.push({
        name: "Error Handling",
        run: async function () {
          const results = [];
          const sim = new SimulationState();

          // test invalid modes (undefined should work with default)
          const invalidModes = ["invalid", "unknown", "", null];
          const validDefaultModes = [undefined];

          for (const mode of invalidModes) {
            try {
              createTestWaveFunction(sim, "gaussian");
              sim.shiftWaveFunction(1, 1, { mode });
              results.push({
                test: `Invalid mode "${mode}"`,
                passed: false,
                details: "Should have thrown an error",
              });
            } catch (e) {
              const correctError = e.message.includes("Unknown boundary mode");
              results.push({
                test: `Invalid mode "${mode}"`,
                passed: correctError,
                details: `Error: ${e.message}`,
              });
            }
          }

          // test that undefined mode uses default and doesn't error
          for (const mode of validDefaultModes) {
            try {
              createTestWaveFunction(sim, "gaussian");
              const normBefore = calculateNorm(sim.psi);
              sim.shiftWaveFunction(1, 1, { mode });
              const normAfter = calculateNorm(sim.psi);
              const hasFiniteValues = sim.psi.every((v) => isFinite(v));
              const worked =
                hasFiniteValues && Math.abs(normBefore - normAfter) < 1e-12;
              results.push({
                test: `Undefined mode (should use default 'wrap')`,
                passed: worked,
                details: `Norm preserved: ${worked}, finite values: ${hasFiniteValues}`,
              });
            } catch (e) {
              results.push({
                test: `Undefined mode (should use default 'wrap')`,
                passed: false,
                details: `Unexpected error: ${e.message}`,
              });
            }
          }

          return results;
        },
      });

      tests.push({
        name: "Grid Size Variations",
        run: async function () {
          const results = [];
          const gridSizes = [
            [8, 8],
            [16, 16],
            [32, 32],
            [64, 64],
            [16, 32],
            [32, 16],
            [10, 20],
            [25, 15],
          ];

          for (const [width, height] of gridSizes) {
            const sim = new SimulationState();
            sim.gridSize.width = width;
            sim.gridSize.height = height;
            sim.psi = new Float64Array(width * height * 2);

            try {
              createTestWaveFunction(sim, "delta");
              const normBefore = calculateNorm(sim.psi);

              // test various shifts
              const shifts = [
                [1, 0],
                [0, 1],
                [width - 1, 0],
                [0, height - 1],
                [Math.floor(width / 2), Math.floor(height / 2)],
              ];

              let allPassed = true;
              for (const [dx, dy] of shifts) {
                for (const mode of ["wrap", "reflect", "drop"]) {
                  sim.psi = new Float64Array(width * height * 2);
                  createTestWaveFunction(sim, "delta");
                  sim.shiftWaveFunction(dx, dy, { mode, renormalize: false });

                  // basic sanity checks
                  const hasFiniteValues = sim.psi.every((v) => isFinite(v));
                  if (!hasFiniteValues) {
                    allPassed = false;
                    break;
                  }
                }
                if (!allPassed) break;
              }

              results.push({
                test: `Grid size [${width}x${height}]`,
                passed: allPassed,
                details: `All basic shifts successful`,
              });
            } catch (e) {
              results.push({
                test: `Grid size [${width}x${height}]`,
                passed: false,
                details: `Error: ${e.message}`,
              });
            }
          }

          return results;
        },
      });

      tests.push({
        name: "Performance Verification",
        run: async function () {
          const results = [];
          const iterations = 100;
          const sim = new SimulationState();

          // test performance of refactored vs original-style implementation
          const shifts = [
            [3, 5],
            [-2, 7],
            [10, -3],
          ];

          for (const [dx, dy] of shifts) {
            for (const mode of ["wrap", "reflect", "drop"]) {
              // time the refactored version
              let refactoredTime = 0;
              for (let i = 0; i < iterations; i++) {
                createTestWaveFunction(sim, "gaussian");
                const start = performance.now();
                sim.shiftWaveFunction(dx, dy, { mode, renormalize: false });
                refactoredTime += performance.now() - start;
              }

              // time the original version
              const originalSim = new OriginalSimulationState();
              let originalTime = 0;
              for (let i = 0; i < iterations; i++) {
                createTestWaveFunction(originalSim, "gaussian");
                const start = performance.now();
                originalSim.shiftWaveFunctionOriginal(dx, dy, {
                  mode,
                  renormalize: false,
                });
                originalTime += performance.now() - start;
              }

              const avgRefactored = refactoredTime / iterations;
              const avgOriginal = originalTime / iterations;
              const speedup = avgOriginal / avgRefactored;
              const isImprovement = speedup >= 0.95; // at least not slower

              results.push({
                test: `Performance [${dx}, ${dy}] mode=${mode}`,
                passed: isImprovement,
                details: `Refactored: ${avgRefactored.toFixed(3)}ms, Original: ${avgOriginal.toFixed(3)}ms, Speedup: ${speedup.toFixed(2)}x`,
              });
            }
          }

          return results;
        },
      });

      // test runner
      window.runAllTests = async function () {
        const resultsDiv = document.getElementById("results");
        resultsDiv.innerHTML =
          '<div class="test-container"><div class="test-header">Running tests...</div></div>';

        const allResults = [];
        let totalTests = 0;
        let passedTests = 0;

        for (const test of tests) {
          const testDiv = document.createElement("div");
          testDiv.className = "test-container";
          testDiv.innerHTML = `<div class="test-header">${test.name}</div><div class="details">Running...</div>`;
          resultsDiv.appendChild(testDiv);

          try {
            const results = await test.run();
            let html = `<div class="test-header">${test.name}</div>`;

            for (const result of results) {
              totalTests++;
              const status = result.passed ? "PASS" : "FAIL";
              const statusClass = result.passed ? "pass" : "fail";

              if (result.passed) passedTests++;

              html += `<div class="details">
                            <span class="${statusClass}">[${status}]</span> ${result.test}`;

              if (result.details) {
                html += `<br>    ${result.details}`;
              }
              if (result.error) {
                html += `<br>    <span class="fail">Error: ${result.error}</span>`;
              }
              if (result.maxDiff && result.maxDiff > 0) {
                html += `<br>    <span class="warn">Max difference: ${result.maxDiff.toExponential(3)}</span>`;
              }

              html += `</div>`;
            }

            testDiv.innerHTML = html;
            allResults.push(...results);
          } catch (e) {
            testDiv.innerHTML = `<div class="test-header">${test.name}</div><div class="details"><span class="fail">[ERROR]</span> ${e.message}</div>`;
          }
        }

        // add summary
        const summaryDiv = document.createElement("div");
        summaryDiv.className = "summary";
        const successRate = ((passedTests / totalTests) * 100).toFixed(1);
        const summaryClass = passedTests === totalTests ? "pass" : "fail";

        summaryDiv.innerHTML = `
                <h2>Test Summary</h2>
                <div class="${summaryClass}">
                    ${passedTests}/${totalTests} tests passed (${successRate}%)
                </div>
                <div class="details">
                    <br>Verification Status: ${passedTests === totalTests ? "✅ ALL TESTS PASS - Refactor maintains 100% behavioral compatibility" : "❌ Some tests failed - Review needed"}
                </div>
            `;

        resultsDiv.insertBefore(summaryDiv, resultsDiv.firstChild);
      };

      window.clearResults = function () {
        document.getElementById("results").innerHTML = "";
      };
    </script>
  </body>
</html>
